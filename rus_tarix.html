<!DOCTYPE html>
<html lang="uz" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rus Adabiyoti Tarixi - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .option-btn { transition: all 0.2s ease-in-out; }
    </style>
    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let mistakes = [];
        let hasAnswered = false;

        // Barcha yuklanishlar tugagach ishga tushadi
        window.onload = function() {
            initQuiz();
        };

        // Savollar va kalitlarni avtomatik ajratib olish (Parsing)
        function initQuiz() {
            const qElem = document.getElementById('raw-questions');
            const kElem = document.getElementById('raw-keys');
            if (!qElem || !kElem) return;

            let qData = qElem.textContent.trim();
            let kData = kElem.textContent.trim();

            // Kalitlarni o'qib olish
            const keyMap = {};
            const keyRegex = /(\d+)-([A-D])/g;
            let match;
            while ((match = keyRegex.exec(kData)) !== null) {
                keyMap[match[1]] = match[2];
            }

            // Savollarni o'qish va ajratish
            const blocks = qData.split(/\n(?=№?\s*\d+\.)/);
            
            blocks.forEach(block => {
                if (!block.trim()) return;
                const blockMatch = block.match(/^№?\s*(\d+)\.\s*([\s\S]+)/);
                if (blockMatch) {
                    const qNum = blockMatch[1];
                    const content = blockMatch[2];

                    // Variantlarni izlash A) ... B) ... C) ... D) ...
                    const optRegex = /A\)([\s\S]+?)B\)([\s\S]+?)C\)([\s\S]+?)D\)([\s\S]+)$/i;
                    const optMatch = content.match(optRegex);

                    if (optMatch) {
                        const qText = content.substring(0, optMatch.index).trim();
                        const correctLetter = keyMap[qNum];
                        const letterMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };

                        if (correctLetter && letterMap[correctLetter] !== undefined) {
                            questions.push({
                                num: parseInt(qNum),
                                q: "№ " + qNum + ". " + qText,
                                options: [
                                    "A) " + optMatch[1].trim(),
                                    "B) " + optMatch[2].trim(),
                                    "C) " + optMatch[3].trim(),
                                    "D) " + optMatch[4].trim()
                                ],
                                correct: letterMap[correctLetter]
                            });
                        }
                    }
                }
            });

            // Raqami bo'yicha tartiblash
            // questions.sort((a, b) => a.num - b.num);

            document.getElementById('total-q-count').innerText = questions.length;
            document.getElementById('total-q-num').innerText = questions.length;
        }

        // Qorong'u rejimni yoqish/o'chirish
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function startQuiz() {
            if(questions.length === 0) {
                alert("Savollar yuklanmadi. Iltimos sahifani yangilang.");
                return;
            }
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            hasAnswered = false;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            document.getElementById('current-score').innerText = score;

            const q = questions[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-gray-700 font-medium text-[16px] sm:text-lg cursor-pointer shadow-sm`;
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (hasAnswered) return;
            hasAnswered = true;
            document.getElementById('next-btn').disabled = false;

            const q = questions[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.option-btn');
            
            allButtons.forEach(btn => {
                btn.classList.remove('hover:bg-blue-50', 'dark:hover:bg-gray-700', 'cursor-pointer');
                btn.classList.add('cursor-not-allowed', 'opacity-70');
            });

            if (selectedIndex === q.correct) {
                btnElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'opacity-70');
                btnElement.classList.add('border-green-500', 'bg-green-100', 'dark:bg-green-900', 'text-green-800', 'dark:text-green-100', 'opacity-100');
                score++;
                document.getElementById('current-score').innerText = score;
            } else {
                btnElement.classList.remove('border-gray-200', 'dark:border-gray-700', 'opacity-70');
                btnElement.classList.add('border-red-500', 'bg-red-100', 'dark:bg-red-900', 'text-red-800', 'dark:text-red-100', 'opacity-100');
                
                const correctBtn = allButtons[q.correct];
                correctBtn.classList.remove('border-gray-200', 'dark:border-gray-700', 'opacity-70');
                correctBtn.classList.add('border-green-500', 'bg-green-100', 'dark:bg-green-900', 'text-green-800', 'dark:text-green-100', 'opacity-100');

                mistakes.push({
                    question: q.q,
                    userAns: q.options[selectedIndex],
                    correctAns: q.options[q.correct]
                });
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-total').innerText = questions.length;

            const mistakesContainer = document.getElementById('mistakes-container');
            mistakesContainer.innerHTML = '';

            if (mistakes.length === 0) {
                document.getElementById('mistakes-section').innerHTML = `<p class="text-center text-green-600 dark:text-green-400 font-bold text-xl">Tabriklaymiz! Barcha javoblaringiz to'g'ri!</p>`;
            } else {
                mistakes.forEach((m) => {
                    mistakesContainer.innerHTML += `
                        <div class="bg-red-50 dark:bg-gray-700 border-l-4 border-red-500 p-4 rounded-r-lg shadow-sm text-left">
                            <p class="font-bold text-gray-800 dark:text-gray-100 mb-2 whitespace-pre-line">${m.question}</p>
                            <p class="text-red-600 dark:text-red-400 text-sm mb-1"><span class="font-semibold">Sizning javobingiz:</span> ${m.userAns}</p>
                            <p class="text-green-600 dark:text-green-400 text-sm font-semibold"><span>To'g'ri javob:</span> ${m.correctAns}</p>
                        </div>
                    `;
                });
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            mistakes = [];
            
            document.getElementById('mistakes-section').innerHTML = `
                <h3 class="text-2xl font-bold mb-6 text-red-500 flex items-center justify-center sm:justify-start"><svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Qilingan Xatolar</h3>
                <div id="mistakes-container" class="space-y-6 max-h-[500px] overflow-y-auto pr-2"></div>
            `;

            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>
</head>

                <span class="text-sm font-semibold bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full">Ball: <span id="current-score" class="text-green-600 dark:text-green-400">0</span></span>

            <div class="mt-10 flex justify-end">

        </div>

        <div id="result-screen" class="p-6 sm:p-10 hidden">

                <div id="mistakes-container" class="space-y-6 max-h-[500px] overflow-y-auto pr-2">
                    </div>
            </div>

            <div class="text-center">
                <button onclick="restartQuiz()" class="px-10 py-4 bg-gray-800 dark:bg-gray-600 hover:bg-gray-900 dark:hover:bg-gray-500 text-white font-bold rounded-xl shadow-lg transition-all text-lg flex items-center justify-center mx-auto">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Qaytadan ishlash

    </div>
