Уровень сложности: 2
Какое это предложение: «обоз весь день простоял у реки и тронулся с места, когда садилось солнце».
A) Сложноподчиненное
B) Простое
C) Бессоюзное
D) Сложносочиненное
№199. Источник: Дмитрусенко Н.Е., Плешакова С.В. Практический курс русского языка. – Ташкент, 2002. Часть II, раздел III, параграф 54.
Уровень сложности: 2
Найдите предложения с однородными членами
A) Ученик прочитал стихотворение негромко.
B) Дети отбирали в лесу лечебные травы и ягоды
C) Дни лета клонились к осени.
D) Небольшой котельчик висел над одним из огней.
№200. Источник: Дмитрусенко Н.Е., Плешакова С.В. Практический курс русского языка. – Ташкент, 2002. Часть II, раздел I, параграф 5.
Уровень сложности: 2
В какой строке во всех словах после буквы ц пишется буква ы?
A) Дирекц…я школы, редакц…я газеты
B) Ц…рковой номер, ц…трусовые деревья
C) Номер гостиниц…, светлолиц…й юноша
D) Ц…тата из книги, генеральная репетиц…я
`;

        const rawKeysData = String.raw`
1-B 2-C 3-A 4-D 5-B 6-C 7-A 8-B 9-D 10-C 11-B 12-A 13-D 14-A 15-C 16-B 17-D 18-A 19-B 20-C 21-A 22-B 23-C 24-D 25-A 26-B 27-C 28-D 29-A 30-B 31-A 32-C 33-D 34-B 35-C 36-A 37-D 38-B 39-C 40-D 41-A 42-C 43-D 44-B 45-A 46-C 47-D 48-B 49-B 50-C 51-A 52-D 53-B 54-C 55-A 56-D 57-B 58-C 59-A 60-D 61-B 62-C 63-A 64-C 65-D 66-B 67-C 68-A 69-D 70-B 71-C 72-A 73-D 74-A 75-B 76-C 77-D 78-A 79-B 80-C 81-D 82-A 83-B 84-C 85-D 86-A 87-B 88-C 89-D 90-A 91-B 92-C 93-D 94-A 95-B 96-C 97-D 98-A 99-B 100-C
101-D 102-B 103-A 104-C 105-D 106-A 107-B 108-B 109-D 110-D 111-B 112-C 113-D 114-A 115-B 116-C 117-D 118-A 119-B 120-C 121-D 122-A 123-B 124-C 125-D 126-A 127-B 128-C 129-D 130-A 131-B 132-C 133-D 134-A 135-B 136-C 137-D 138-A 139-B 140-C 141-D 142-A 143-B 144-C 145-D 146-A 147-B 148-C 149-D 150-A 151-B 152-C 153-D 154-A 155-B 156-C 157-D 158-A 159-B 160-C 161-D 162-A 163-B 164-C 165-D 166-A 167-B 168-C 169-D 170-A 171-B 172-C 173-D 174-A 175-B 176-C 177-D 178-A 179-B 180-C 181-D 182-A 183-B 184-C 185-D 186-A 187-B 188-C 189-D 190-A 191-B 192-C 193-D 194-A 195-B 196-C 197-D 198-A 199-B 200-C
`;

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let mistakes = [];
        let currentOptions = [];
        let hasAnswered = false;

        // Ma'lumotlarni o'qish va tayyorlash
        function parseQuestions() {
            const keysMap = {};
            const keyRegex = /(\d+)-([A-D])/g;
            let match;
            while ((match = keyRegex.exec(rawKeysData)) !== null) {
                keysMap[match[1]] = match[2];
            }

            const qRegex = /№\s*(\d+)\.(.*?)(?=(?:№\s*\d+\.)|$)/gs;
            while ((match = qRegex.exec(rawQuestionsData)) !== null) {
                const qNum = match[1];
                const block = match[2];
                const optRegex = /A\)(.*?)B\)(.*?)C\)(.*?)D\)(.*)/s;
                const optMatch = optRegex.exec(block);

                if (optMatch) {
                    const qTextFull = block.substring(0, optMatch.index).trim();
                    // Ortiqcha "Источник" ma'lumotlarini qirqib olish ixtiyoriy, ammo savolni toza chiqarish uchun qoldirish ham mumkin.
                    // Keling savolni chiroyli qilib olamiz (qiyinlik darajasidan keyingi matn)
                    const lines = qTextFull.split('\n');
                    const cleanQText = lines.filter(l => !l.includes('Источник:') && !l.includes('Уровень сложности:')).join('\n').trim();

                    const opts = [
                        optMatch[1].trim(),
                        optMatch[2].trim(),
                        optMatch[3].trim(),
                        optMatch[4].trim()
                    ];

                    const ansChar = keysMap[qNum];
                    let ansIndex = 0;
                    if (ansChar === 'B') ansIndex = 1;
                    else if (ansChar === 'C') ansIndex = 2;
                    else if (ansChar === 'D') ansIndex = 3;

                    questions.push({
                        qNumber: qNum,
                        question: cleanQText,
                        options: opts,
                        correctIndex: ansIndex,
                        correctText: opts[ansIndex]
                    });
                }
            }
            document.getElementById('total-q-count').innerText = questions.length;
        }

        // Ilovani initsializatsiya qilish
        function initApp() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            parseQuestions();
        }

        // Qorong'u/Yorug' rejimni almashtirish
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Testni boshlash
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            mistakes = [];
            document.getElementById('current-score').innerText = score;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            renderQuestion();
        }

        // Savolni ekranga chizish
        function renderQuestion() {
            hasAnswered = false;
            const q = questions[currentQuestionIndex];
            
            document.getElementById('question-indicator').innerText = `Savol ${currentQuestionIndex + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Har safar variantlarni to'g'ri bog'lab chizish
            currentOptions = q.options.map((text, idx) => ({ text, index: idx, isCorrect: idx === q.correctIndex }));
            
            currentOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-medium`;
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="flex-shrink-0 w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400 flex items-center justify-center font-bold">
                            ${['A', 'B', 'C', 'D'][idx]}
                        </span>
                        <span>${opt.text}</span>
                    </div>
                `;
                btn.onclick = () => selectOption(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // Javob bosilganda (Darhol tekshirish)
        function selectOption(selectedIndex, selectedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const isCorrect = currentOptions[selectedIndex].isCorrect;
            const buttons = document.getElementById('options-container').querySelectorAll('.option-btn');
            
            buttons.forEach((btn, idx) => {
                btn.classList.remove('hover:bg-blue-50', 'dark:hover:bg-gray-700');
                btn.classList.add('locked');
                
                if (currentOptions[idx].isCorrect) {
                    btn.classList.remove('border-gray-200', 'dark:border-gray-700', 'bg-white', 'dark:bg-gray-800');
                    btn.classList.add('border-green-500', 'bg-green-50', 'dark:bg-green-900/40');
                    btn.innerHTML = btn.innerHTML.replace('bg-gray-100', 'bg-green-500 text-white').replace('dark:bg-gray-700', 'bg-green-500 text-white').replace('text-gray-500', 'text-white').replace('dark:text-gray-400', 'text-white');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.remove('border-gray-200', 'dark:border-gray-700', 'bg-white', 'dark:bg-gray-800');
                    btn.classList.add('border-red-500', 'bg-red-50', 'dark:bg-red-900/40');
                    btn.innerHTML = btn.innerHTML.replace('bg-gray-100', 'bg-red-500 text-white').replace('dark:bg-gray-700', 'bg-red-500 text-white').replace('text-gray-500', 'text-white').replace('dark:text-gray-400', 'text-white');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            if (isCorrect) {
                score++;
                document.getElementById('current-score').innerText = score;
            } else {
                mistakes.push({
                    qNum: questions[currentQuestionIndex].qNumber,
                    question: questions[currentQuestionIndex].question,
                    userAnswer: currentOptions[selectedIndex].text,
                    correctAnswer: questions[currentQuestionIndex].correctText
                });
            }

            document.getElementById('next-btn').disabled = false;
        }

        // Keyingi savolga o'tish
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        // Natijalarni ko'rsatish
        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('total-score').innerText = questions.length;

            const mistakesSection = document.getElementById('mistakes-section');
            const mistakesContainer = document.getElementById('mistakes-container');
            
            if (mistakes.length > 0) {
                mistakesSection.classList.remove('hidden');
                mistakesContainer.innerHTML = '';
                mistakes.forEach(m => {
                    mistakesContainer.innerHTML += `
                        <div class="bg-red-50 dark:bg-red-900/20 p-4 rounded-xl border border-red-200 dark:border-red-800 text-left">
                            <p class="font-bold text-gray-800 dark:text-gray-200 mb-2"><span class="text-blue-500">№${m.qNum}.</span> ${m.question}</p>
                            <p class="text-sm text-red-600 dark:text-red-400 mb-1"><span class="font-semibold">Sizning javobingiz:</span> ${m.userAnswer}</p>
                            <p class="text-sm text-green-600 dark:text-green-400"><span class="font-semibold">To'g'ri javob:</span> ${m.correctAnswer}</p>
                        </div>
                    `;
                });
            } else {
                mistakesSection.classList.add('hidden');
            }
        }

        // Qaytadan ishlash
        function restartQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        // Dasturni ishga tushirish
        initApp();
    </script>
</body>
</html>
