    <main class="flex-grow container mx-auto px-4 py-8 max-w-3xl flex flex-col">

                    Jami savollar soni: <span id="total-q-count">0</span> ta
                </div>
                <button id="start-btn" class="w-full md:w-auto px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 text-lg">
                    Testni boshlash
                </button>
            </div>
        </div>

        <div id="quiz-screen" class="hidden flex-col flex-grow animate-fade-in">
            <div class="bg-white dark:bg-gray-850 p-6 md:p-8 rounded-2xl shadow-lg w-full mb-6 relative">
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b border-gray-200 dark:border-gray-700 gap-4">
                    <span class="text-xs md:text-sm font-semibold text-gray-500 dark:text-gray-400 leading-relaxed" id="q-meta"></span>
                    <span class="bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 py-1 px-3 rounded-full text-sm font-bold shadow-sm whitespace-nowrap">
                        Savol: <span id="current-q-num">1</span> / <span id="quiz-total-count">0</span>
                    </span>
                </div>

                <h3 id="question-text" class="text-lg md:text-xl font-medium mb-8 leading-relaxed whitespace-pre-wrap"></h3>

                <div id="options-container" class="space-y-4 mb-8">
                    </div>

                <div class="flex justify-end">
                    <button id="next-btn" disabled class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 disabled:dark:bg-gray-600 text-white font-bold rounded-xl shadow transition-all cursor-not-allowed opacity-50">
                        Keyingisi ➔
                    </button>
                </div>
            </div>
        </div>

        <div id="results-screen" class="hidden flex-col items-center flex-grow animate-fade-in w-full">
            <div class="bg-white dark:bg-gray-850 p-8 rounded-2xl shadow-lg w-full text-center mb-6">
                <h2 class="text-3xl font-bold mb-2">Test yakunlandi!</h2>
                <div class="text-6xl my-6">🏆</div>
                <p class="text-xl font-medium mb-2">Umumiy ball:</p>
                <p class="text-4xl font-black text-indigo-600 dark:text-indigo-400 mb-8">
                    <span id="score-correct">0</span> / <span id="score-total">0</span>
                </p>
                <button id="restart-btn" class="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-lg transition-all">
                    Qaytadan ishlash
                </button>
            </div>

            <div id="mistakes-container" class="w-full bg-white dark:bg-gray-850 p-6 rounded-2xl shadow-lg hidden">

                <div id="mistakes-list" class="space-y-6">
                    </div>
            </div>
        </div>

    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if(document.documentElement.classList.contains('dark')) {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        });

        function parseQuestions() {
            const rawText = document.getElementById('raw-data').textContent;
            
            // To'g'ri javoblarni olish
            const answers = {};
            const answerRegex = /(\d+)\s*-\s*([A-D])/g;
            let match;
            while ((match = answerRegex.exec(rawText)) !== null) {
                answers[match[1]] = match[2];
            }

            const questions = [];
            // Barcha savollarni belgilangan formatda aniq bo'lib olish
            const qBlocks = rawText.split(/№\s*(\d+)\.?\s*/);
            
            for (let i = 1; i < qBlocks.length; i += 2) {
                const id = qBlocks[i].trim();
                const block = qBlocks[i+1];
                
                const aMatch = block.match(/(?:\n|^)\s*A\)/);
                const bMatch = block.match(/(?:\n|^)\s*B\)/);
                const cMatch = block.match(/(?:\n|^)\s*C\)/);
                const dMatch = block.match(/(?:\n|^)\s*D\)/);
                
                if(aMatch && bMatch && cMatch && dMatch) {
                    const aIdx = aMatch.index;
                    const bIdx = bMatch.index;
                    const cIdx = cMatch.index;
                    const dIdx = dMatch.index;
                    
                    const metaAndQ = block.substring(0, aIdx).trim();
                    let meta = "";
                    let qText = metaAndQ;
                    
                    const matchLvl = metaAndQ.match(/(Источник:.*?(?:Уровень сложности|Уровень Уровень сложности):\s*\d+)/i) || metaAndQ.match(/(Уровень сложности:\s*\d+)/i);
                    
                    if (matchLvl) {
                        const splitIdx = matchLvl.index + matchLvl[0].length;
                        meta = metaAndQ.substring(0, splitIdx).trim().replace(/;\s*$/, '');
                        qText = metaAndQ.substring(splitIdx).trim().replace(/^;/, '').trim();
                    } else {
                        const lines = metaAndQ.split('\n').filter(l => l.trim() !== '');
                        meta = lines.length > 0 ? lines[0].trim() : '';
                        qText = lines.slice(1).join('\n').trim();
                    }
                    
                    const optA = block.substring(aIdx + aMatch[0].length, bIdx).trim().replace(/^"|"$/g, '');
                    const optB = block.substring(bIdx + bMatch[0].length, cIdx).trim().replace(/^"|"$/g, '');
                    const optC = block.substring(cIdx + cMatch[0].length, dIdx).trim().replace(/^"|"$/g, '');
                    let optD_raw = block.substring(dIdx + dMatch[0].length).trim().replace(/^"|"$/g, '');
                    
                    const toghriIdx = optD_raw.indexOf("TO'G'RI JAVOBLAR");
                    if (toghriIdx > -1) optD_raw = optD_raw.substring(0, toghriIdx).trim();
                    
                    if(answers[id]) {
                        questions.push({
                            id: id,
                            meta: meta,
                            question: qText,
                            options: { 'A': optA, 'B': optB, 'C': optC, 'D': optD_raw },
                            correct: answers[id]
                        });
                    }
                }
            }
            return questions;
        }

        let quizData = [];
        let currentIndex = 0;
        let score = 0;
        let mistakes = [];
        let hasAnswered = false;

        window.onload = () => {
            quizData = parseQuestions();
            document.getElementById('total-q-count').textContent = quizData.length;
            document.getElementById('quiz-total-count').textContent = quizData.length;
        };

        startBtn.addEventListener('click', () => {
            if(quizData.length === 0) {
                alert("Kechirasiz, savollar topilmadi. Raw Data qismini tekshiring.");
                return;
            }
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('flex');
            loadQuestion();
        });

        function loadQuestion() {
            hasAnswered = false;
            nextBtn.disabled = true;
            nextBtn.classList.add('cursor-not-allowed', 'opacity-50');
            nextBtn.classList.remove('hover:bg-indigo-700');

            const currentQ = quizData[currentIndex];
            
            document.getElementById('current-q-num').textContent = currentIndex + 1;
            document.getElementById('q-meta').textContent = currentQ.meta;
            document.getElementById('question-text').textContent = currentQ.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            for (const [key, value] of Object.entries(currentQ.options)) {
                const optBtn = document.createElement('div');
                optBtn.className = 'option-btn border-2 border-gray-200 dark:border-gray-700 rounded-xl p-4 cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/40 text-lg flex items-start gap-4';
                optBtn.innerHTML = `
                    <span class="font-bold text-indigo-600 dark:text-indigo-400 min-w-[24px]">${key})</span>
                    <span class="flex-grow">${value}</span>
                `;
                optBtn.onclick = () => checkAnswer(key, optBtn);
                optionsContainer.appendChild(optBtn);
            }
        }

        function checkAnswer(selectedKey, selectedBtn) {
            if(hasAnswered) return;
            hasAnswered = true;
            
            const currentQ = quizData[currentIndex];
            const optionsBtns = document.getElementById('options-container').children;

            if (selectedKey === currentQ.correct) {
                score++;
                selectedBtn.classList.add('correct-ans');
            } else {
                selectedBtn.classList.add('wrong-ans');
                mistakes.push({
                    q: currentQ,
                    userAns: selectedKey
                });
                for(let btn of optionsBtns) {
                    if(btn.textContent.trim().startsWith(`${currentQ.correct})`)) {
                        btn.classList.add('correct-ans');
                    }
                }
            }

            for(let btn of optionsBtns) {
                btn.classList.remove('cursor-pointer', 'hover:bg-indigo-50', 'dark:hover:bg-indigo-900/40');
            }

            nextBtn.disabled = false;
            nextBtn.classList.remove('cursor-not-allowed', 'opacity-50');
            nextBtn.classList.add('hover:bg-indigo-700');
        }

        nextBtn.addEventListener('click', () => {
            currentIndex++;
            if(currentIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            quizScreen.classList.remove('flex');
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            resultsScreen.classList.add('flex');

            document.getElementById('score-correct').textContent = score;
            document.getElementById('score-total').textContent = quizData.length;

            const mistakesContainer = document.getElementById('mistakes-container');
            const mistakesList = document.getElementById('mistakes-list');
            mistakesList.innerHTML = '';

            if(mistakes.length > 0) {
                mistakesContainer.classList.remove('hidden');
                mistakes.forEach((m) => {
                    const div = document.createElement('div');
                    div.className = 'bg-gray-50 dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 text-left';
                    div.innerHTML = `
                        <p class="font-bold mb-2 text-sm text-gray-500">${m.q.meta}</p>
                        <p class="font-bold mb-3 text-lg">№${m.q.id}. ${m.q.question}</p>
                        <p class="text-red-500 dark:text-red-400 mb-1">❌ Sizning javobingiz: <span class="font-medium">${m.q.options[m.userAns]}</span></p>
                        <p class="text-green-600 dark:text-green-400">✅ To'g'ri javob: <span class="font-medium">${m.q.options[m.q.correct]}</span></p>
                    `;
                    mistakesList.appendChild(div);
                });
            } else {
                mistakesContainer.classList.add('hidden');
            }
        }

        restartBtn.addEventListener('click', () => {
            currentIndex = 0;
            score = 0;
            mistakes = [];
            resultsScreen.classList.remove('flex');
            resultsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startScreen.classList.add('flex');
        });
    </script>
</body>
</html>
